<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#170B0E" />
    <title>Belle Food | 24-Hour Kitchen on Chevron Drive, Lekki</title>
    <meta
      name="description"
      content="Belle Food is a women-owned, founder-led kitchen on Chevron Drive, Eti-Osa, Lekki — open 24 hours, every day. Dine-in, takeaway or no-contact delivery. Founded by King Mitchy."
    />
    <meta name="robots" content="index, follow" />

    <!--
      og:image must be a raster file: no social scraper renders SVG, so the
      engraving that used to sit here produced a blank card everywhere. The
      paths are site-root-relative because the deployed domain isn't known
      here; swap them for absolute https:// URLs at deploy time, which is what
      the Open Graph spec asks for and what the stricter scrapers require.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_NG" />
    <meta property="og:site_name" content="Belle Food" />
    <meta property="og:title" content="Belle Food | 24-Hour Kitchen on Chevron Drive, Lekki" />
    <meta
      property="og:description"
      content="Lagos never sleeps. Neither does the kitchen. Women-owned, founder-led, open 24 hours — dine-in, takeaway or no-contact delivery."
    />
    <meta property="og:image" content="/images/og-belle-food.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The lit 24/7 BELLEFOOD sign above strings of festoon bulbs over the forecourt at night"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Belle Food | 24-Hour Kitchen on Chevron Drive, Lekki" />
    <meta
      name="twitter:description"
      content="Lagos never sleeps. Neither does the kitchen. Women-owned, founder-led, open 24 hours."
    />
    <meta name="twitter:image" content="/images/og-belle-food.jpg" />
    <meta
      name="twitter:image:alt"
      content="The lit 24/7 BELLEFOOD sign above strings of festoon bulbs over the forecourt at night"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
